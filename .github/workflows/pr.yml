name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    # Temporary. This branch with the fix provides additional inputs and is based on ai-dial-ci version 4.7.0
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@feat/ort-allow-dynamic-versions-report-formats
    with:
      node-version: "24"
      # ORT 90: fixes ORT 85 NPM graph mapping on Nx 23 lockfile (analyzer: ~2h → ~30m)
      ort-version: "90.0.0"
      # ort-config-revision for ORT 90
      ort-config-revision: "605e909bfe81ee916f66533b7139ac5bdaf1081c"
      # Skip WebApp (OOM at 5 GiB heap); CycloneDX + SPDX are enough for compliance
      ort-report-formats: "CycloneDx,SpdxDocument" # feat branch additional input
    secrets: inherit
