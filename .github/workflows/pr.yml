name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@4.5.0
    with:
      node-version: "24"
      ort-version: "90.0.0"
      ort-config-revision: "605e909bfe81ee916f66533b7139ac5bdaf1081c"
    secrets: inherit
