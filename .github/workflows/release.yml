name: Release Workflow

on:
  push:
    branches: [development, release-*]

permissions:
  contents: write
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: epam/ai-dial-ci/.github/workflows/node_release.yml@4.5.0
    with:
      promote: true
      publish-enabled: false
      draft-stable-releases: true
      node-version: "24"
      ort-version: "90.0.0"
      ort-config-revision: "605e909bfe81ee916f66533b7139ac5bdaf1081c"
    secrets: inherit
